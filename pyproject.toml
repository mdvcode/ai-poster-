[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-poster"
version = "0.1.0"
description = "Telegram-controlled content curation from Telegram and X"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "pydantic-settings>=2.10,<3", "telethon>=1.42,<2"]

[project.scripts]
ai-poster = "ai_poster.main:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
